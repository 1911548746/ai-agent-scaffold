name: ai-agent-scaffold

services:
  ai-agent-scaffold-app:
    image: ${APP_IMAGE:-ai-agent-scaffold-app:1.0}
    build:
      # Dockerfile 是多模块 Maven 构建，必须使用仓库根目录作为 context。
      context: ../..
      dockerfile: ai-agent-scaffold-app/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: ${STOP_GRACE_PERIOD:-35s}
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
      # 管理端口只发布到宿主机回环地址；远程采集应通过受控网络或显式覆盖此配置。
      - "127.0.0.1:${HOST_MANAGEMENT_PORT:-8081}:8081"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_ADDRESS: "0.0.0.0"
      MANAGEMENT_SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:-30s}
      AI_APPLICATION_MODE: ${AI_APPLICATION_MODE:-online}
      AI_CORS_ALLOWED_ORIGINS: ${AI_CORS_ALLOWED_ORIGINS:-}
      # 凭据只由部署环境注入；Compose 不提供任何默认密码或模型 Key。
      MODEL_API_KEY: ${MODEL_API_KEY:?请设置 MODEL_API_KEY}
      # online 模式由应用校验 JWT_SECRET；local 模式不需要该变量。
      JWT_SECRET: ${JWT_SECRET:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?请设置 SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?请设置 SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?请设置 SPRING_DATASOURCE_PASSWORD}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - ai-agent-scaffold-network

networks:
  ai-agent-scaffold-network:
    # 数据库环境 Compose 负责创建该网络，应用侧只接入，避免 Compose 项目名导致网络名漂移。
    name: ${COMPOSE_NETWORK_NAME:-ai-agent-scaffold-network}
    external: true
