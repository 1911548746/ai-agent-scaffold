ai:
  agent:
    config:
      enabled: true
      schema-version: 1
      catalog-path: classpath:agent/catalog/default-catalog.yml
      model-resources:
        - classpath:agent/models/**/*.yml
      tool-resources:
        - classpath:agent/tools/**/*.yml
      skill-resources:
        - classpath:agent/skills/**/*.yml
      agent-resources:
        - classpath:agent/agents/**/*.yml
      workflow-resources:
        - classpath:agent/workflows/**/*.yml
      application-resources:
        - classpath:agent/applications/**/*.yml
