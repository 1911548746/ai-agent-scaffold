ai:
  agent:
    config:
      tables:
        HelloAgent:
          app-name: HelloAgent
          agent-info:
            agent-id: 100000
            agent-name: 测试智能体00
            agent-desc: 一个测试的智能体
          module:
            chat-model:
                base-url: https://api.siliconflow.cn
                api-key: sk-lddiozvjmpxmdsdjqcjtthuvpwxrpdiyepesltiwfzbgiicw
                model-name: deepseek-ai/DeepSeek-V4-Flash
            agents:
                - name: HelloAgent
                  description: A minimal ADK Java hello agent.
                  instruction: You are a concise assistant. Say hello in a friendly way.
                  mcp-tool-list:
                    - local:
                        bean-name: myTestMcpServer
                        method-name: getWeather
                  skills-dir: classpath:agent/skills
            runner:
                agent-name: HelloAgent
                persistence: true
                context-compress:
                    # slidingWindow: 滑动窗口      fixedSize: 固定窗口
                    type: slidingWindow
                    compaction-interval: 8
                    overlap-size: 2
                plugin-name-list:
                  - myLoggingPlugin
