ai:
  agent:
    application:
      id: multimodal-agent
      app-name: MultimodalAgent
      agent-id: 100006
      agent-name: MultimodalAgent
      agent-desc: 一个多模态智能体
      agent-ref: multimodal-agent
      runner:
        session-storage: true
        artifact-storage:
          type: minio # memory | minio | local
          # minio 专属配置
          ttl: 24h  # 仅允许 minio 使用；不配置表示保留到 Session 手动删除
          lifecycle-enabled: true # 仅在配置 MinIO TTL 时生效，默认 `false`
        group-function-responses-in-history: true
        context-compress:
          type: pureSlidingWindow
          invocation-retention-size: 4
        plugin-name-list:
          - myLoggingPlugin
