spring:
  application:
    name: ai-agent-scaffold-app
  config:
    name: ai-agent-scaffold-app
  profiles:
    active: dev
  lifecycle:
    # Docker 默认 SIGTERM 等待时间会覆盖该值，确保停止容器时先停止接收请求并等待在途调用结束。
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 非空历史库先建立 baseline 元数据，再执行 V1 及后续增量脚本。
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

server:
  # 容器以 SIGTERM 停止时，等待 Web 容器完成在途请求后再关闭 Spring 上下文。
  shutdown: graceful

logging:
  level:
    # LangChain4j 默认会为每一次中间重试输出完整 WARN 堆栈；最终失败由项目异常边界统一记录一次。
    dev.langchain4j.internal.RetryUtils: error

# OPS-01：运维端点与业务端口隔离，默认只允许本机采集；容器部署时再显式覆盖监听地址。
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        # 管理端口隔离后仍在业务端口提供 /livez 与 /readyz，供编排平台探测。
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          # readiness 同时检查应用状态、数据库和已原子发布的 Agent Runtime 快照。
          include: readinessState,db,agentRuntime
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# DATA-03：生产默认删除被 compaction marker 覆盖的 Event；开发环境可覆盖为 false 以保留调试轨迹。
ai:
  application:
    # 缺省保持线上模式，避免漏配时关闭鉴权；本地调试可设置为 local。
    mode: ${AI_APPLICATION_MODE:online}
  web:
    cors:
      # 线上必须显式配置来源，多个来源用逗号分隔，为空表示不开放跨域来源；本地模式固定使用回环来源。
      allowed-origins: ${AI_CORS_ALLOWED_ORIGINS:}
  auth:
    # 不提供默认密钥；所有运行环境必须显式设置 JWT_SECRET，避免弱密钥误部署。
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:ai-agent-scaffold}
    access-token-ttl-seconds: ${JWT_EXPIRATION_SECONDS:72000}
  agent:
    attachment:
      # 端点、访问密钥和密钥只由部署环境注入；不要在仓库配置中填写真实值。
      enabled: ${MINIO_ATTACHMENT_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:}
      bucket: ${MINIO_ATTACHMENT_BUCKET:agent-attachments}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      ttl: ${MINIO_ATTACHMENT_TTL:24h}
    session:
      compaction:
        delete-compacted-events: true
