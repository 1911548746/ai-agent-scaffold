ai:
  agent:
    config:
      enabled: true
      schema-version: 1
      catalog-path: classpath:agent/catalog/discovery/wildcard-catalog.yml
      model-resources:
        - classpath:agent-fixtures/discovery/models/**/*.yml
      tool-resources:
        - classpath:agent-fixtures/discovery/tools/**/*.yml
      agent-resources:
        - classpath:agent-fixtures/discovery/agents/**/*.yml
      workflow-resources: []
      application-resources:
        - classpath:agent-fixtures/discovery/applications/**/*.yml
